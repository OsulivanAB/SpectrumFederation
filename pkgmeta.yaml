package-as: SpectrumFederation
enable-nolib-creation: no

move-folders:
  SpectrumFederation/SpectrumFederation: SpectrumFederation

# Ignore everything at repo root except the SpectrumFederation/ folder
ignore:
  - .github
  - .devcontainer
  - .previews
  - .git
  - .gitignore
  - .gitattributes
  - .editorconfig
  - .luaarc.json
  - .luacheckrc
  - .vscode
  - BlizzardUI
  - build
  - docs
  - site
  - assets
  - requirements-docs.txt
  - mkdocs.yml
  - pkgmeta.yaml
  - README.md
  - CHANGELOG.md
  - LICENSE
  - SpectrumFederation/AGENTS.md

manual-changelog: CHANGELOG.md
license-output: LICENSE
