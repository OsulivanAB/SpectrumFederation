site_name: Spectrum Federation
site_description: World of Warcraft addon for the Spectrum Federation guild on Garona
site_author: OsulivanAB
site_url: https://osullivanab.github.io/SpectrumFederation/

repo_name: OsulivanAB/SpectrumFederation
repo_url: https://github.com/OsulivanAB/SpectrumFederation

theme:
  name: material
  favicon: assets/favicon.png
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.blocks.admonition:
      types:
        - note
        - abstract
        - info
        - tip
        - success
        - question
        - warning
        - failure
        - danger
        - bug
        - example
        - quote
        - under-construction
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
    - Loot Helper: features/loot-helper.md
    - Point Based: features/point-based.md
    - Reward Pot: features/reward-pot.md
    - Raid Check: features/raid-check.md
    - Sync Sessions: features/sync-sessions.md
    - Loot Logs: features/loot-logs.md
    - Cursed Surge Tracker: features/cursed-surge-tracker.md
    - Settings and Gameplay: settings-ui.md
  - Reference:
    - Slash Commands: reference/slash-commands.md
    - Troubleshooting: reference/troubleshooting.md
  - Tools:
    - Google Sheet Sync: development/tools/google-sheet-sync.md
  - Development:
    - Contributing: development/getting-started/index.md
    - Addon Architecture: development/architecture.md
    - Settings System: development/settings-ui/index.md
    - Loot Helper Internals: development/loot-helper/index.md
    - Automation and Releases: development/automation.md

plugins:
  - search
  - mermaid2