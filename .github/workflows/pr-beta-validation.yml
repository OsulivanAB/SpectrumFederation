name: PR Beta Validation

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'SpectrumFederation/**'
      - 'SpectrumFederation_CursedSurgeTracker/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/requirements-lint.txt'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'tests/**'

concurrency:
  group: beta-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-addon-changes:
    name: Detect Addon Changes
    runs-on: ubuntu-latest
    outputs:
      addon_changed: ${{ steps.changes.outputs.addon_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for addon changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'SpectrumFederation/' 'SpectrumFederation_CursedSurgeTracker/')
          if [[ -n "$CHANGED_FILES" ]]; then
            echo "addon_changed=true" >> "$GITHUB_OUTPUT"
            echo "Addon files changed:"
            echo "$CHANGED_FILES"
          else
            echo "addon_changed=false" >> "$GITHUB_OUTPUT"
            echo "No addon files changed."
          fi

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Install Python linters
        run: pip install -r .github/requirements-lint.txt

      - name: Run unified linter
        run: python3 .github/scripts/lint_all.py

  validate-packaging:
    name: Validate Package Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate addon packaging
        run: python3 .github/scripts/validate_packaging.py

  check-version-bump:
    name: Check Version Bump
    needs: detect-addon-changes
    if: needs.detect-addon-changes.outputs.addon_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history to compare versions

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check version was bumped
        run: python3 .github/scripts/check_version_bump.py beta

  check-duplicate-beta-release:
    name: Check for Duplicate Beta Release
    needs: detect-addon-changes
    if: needs.detect-addon-changes.outputs.addon_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Extract version from TOC
        id: version
        run: |
          VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check for duplicate release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_duplicate_release.py "${{ steps.version.outputs.version }}"

  run-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install lua5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/test_settings_navigation.py tests/test_cursed_surge_tracker.py tests/test_mouse_tracer.py

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate documentation build
        run: python3 .github/scripts/validate_docs.py
