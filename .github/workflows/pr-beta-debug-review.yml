name: PR Beta Debug Review

on:
  pull_request_target:
    branches:
      - beta
    types: [opened, synchronize, reopened]
    paths:
      - 'SpectrumFederation/**/*.lua'
      - '!SpectrumFederation/locale/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review and add debugging'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: debug-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review-and-debug:
    name: Review Code and Suggest Debugging
    runs-on: ubuntu-latest
    environment: debug-review

    steps:
      - name: Get PR details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            // Determine PR number based on trigger type
            const prNumber = context.payload.pull_request?.number || ${{ github.event.inputs.pr_number || 0 }};

            if (!prNumber) {
              core.setFailed('Could not determine PR number');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // Verify PR targets beta
            if (pr.data.base.ref !== 'beta') {
              core.setFailed(`PR #${pr.data.number} does not target beta branch (targets ${pr.data.base.ref})`);
              return;
            }

            core.setOutput('pr_number', pr.data.number);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('pr_author', pr.data.user.login);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-details.outputs.head_ref }}
          fetch-depth: 0

      - name: Fetch beta branch for comparison
        run: |
          git fetch origin beta:beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Analyze code and suggest debugging
        id: analyze-debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
          BASE_REF: ${{ steps.pr-details.outputs.base_ref }}
        run: |
          python3 .github/scripts/analyze_debug_improvements.py

      - name: Check if changes were made
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No debugging improvements suggested"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Debugging improvements detected, will create PR"
          fi

      - name: Create commit with debugging improvements
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add SpectrumFederation/
          git commit -m "debug: add debugging improvements based on code review

          This commit adds strategic debugging statements using the SF.Debug system
          to improve observability and troubleshooting capabilities.

          Auto-generated by debug review workflow."

      - name: Push changes to new branch
        if: steps.check-changes.outputs.has_changes == 'true'
        id: push-branch
        run: |
          BRANCH_NAME="debug-improvements-pr-${{ steps.pr-details.outputs.pr_number }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME" --force

      - name: Create PR with debugging improvements
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = '${{ steps.push-branch.outputs.branch_name }}';
            const baseBranch = '${{ steps.pr-details.outputs.head_ref }}';
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};

            // Check if PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              base: baseBranch,
              state: 'open'
            });

            let debugPR;
            if (existingPRs.data.length > 0) {
              // Update existing PR
              debugPR = existingPRs.data[0];
              console.log(`Updated existing PR #${debugPR.number}`);
            } else {
              // Create new PR
              const newPR = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `debug: Add debugging improvements for PR #${prNumber}`,
                head: branchName,
                base: baseBranch,
                body: `## Debugging Improvements

            This PR adds strategic debugging statements to the code changes in PR #${prNumber}.

            ### Changes Made

            The following debugging improvements were suggested by automated code review:

            - Added \`SF.Debug:Info()\` calls at key decision points
            - Added \`SF.Debug:Warn()\` calls for potential error conditions
            - Added \`SF.Debug:Error()\` calls in error handling paths
            - Added \`SF.Debug:Verbose()\` calls for detailed execution flow

            ### Debug Categories Used

            Debug statements use appropriate categories (e.g., "PROFILES", "LOOT_HELPER", "UI") to help with filtering and troubleshooting.

            ### How to Use

            Enable debug logging in-game with:
            \`\`\`
            /sfdebug on
            \`\`\`

            View debug logs with:
            \`\`\`
            /sfdebug show
            \`\`\`

            ### Review Notes

            - Review each debugging statement for appropriateness
            - Remove any excessive or unnecessary logging
            - Adjust log levels if needed
            - Merge this PR into your feature branch if the suggestions are helpful

            ---
            **Auto-generated by PR Beta Debug Review workflow**
            **Related to PR #${prNumber}**`
              });
              debugPR = newPR.data;
              console.log(`Created new PR #${debugPR.number}`);
            }

            // Comment on original PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🔍 Debug Review Complete

            Automated code review has identified opportunities to add debugging statements to your code.

            **Debug Improvements PR**: #${debugPR.number}

            Review the suggested debugging improvements and merge them into your branch if appropriate.

            The debugging suggestions use the existing \`SF.Debug\` system with appropriate log levels:
            - \`Info\`: Key operations and state changes
            - \`Warn\`: Potential issues or edge cases
            - \`Error\`: Error conditions
            - \`Verbose\`: Detailed execution flow

            ---
            *Generated by PR Beta Debug Review workflow*`
            });

      - name: No changes needed
        if: steps.check-changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.pr_number }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## 🔍 Debug Review Complete

            Automated code review found no additional debugging needed for this PR.

            Your code already has appropriate debugging or doesn't require additional debug statements.

            ---
            *Generated by PR Beta Debug Review workflow*`
            });
