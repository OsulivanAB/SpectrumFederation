name: "Copilot Setup Steps"

# Run automatically when this file changes for easy validation,
# and allow manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            .devcontainer/requirements.txt

      - name: Install OS packages (Lua + Luarocks)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            lua5.1 \
            luarocks

      - name: Install Python tooling (yamllint + docs deps)
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .devcontainer/requirements.txt
          python -m pip install ruff==0.16.2

      - name: Install luacheck (Lua linter)
        run: |
          set -euxo pipefail
          luarocks install --local luacheck
          echo "${HOME}/.luarocks/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          python --version
          luacheck --version
          yamllint --version
          ruff --version

      - name: Fetch Blizzard UI reference sources (best effort)
        continue-on-error: true
        run: |
          set -euxo pipefail

          mkdir -p BlizzardUI

          clone_or_update() {
            local dir="$1"
            local branch="$2"
            local repo="https://github.com/Gethe/wow-ui-source.git"

            if [ -d "${dir}/.git" ]; then
              git -C "${dir}" fetch origin "${branch}" --depth=1
              git -C "${dir}" checkout "${branch}"
              git -C "${dir}" reset --hard "origin/${branch}"
            else
              rm -rf "${dir}"
              git clone --depth 1 --branch "${branch}" "${repo}" "${dir}"
            fi
          }

          clone_or_update "BlizzardUI/live" "live"
          clone_or_update "BlizzardUI/beta" "beta"

          echo "[BlizzardUI] Directory contents:"
          ls -la BlizzardUI || true
