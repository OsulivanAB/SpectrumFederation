name: Promote Beta to Main

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-release
  cancel-in-progress: false

# GitHub Actions default `if: success()` is false when ANY ancestor job was
# skipped. Optional jobs therefore use explicit result checks. Do not add a
# skippable job to this graph without giving every descendant an explicit `if:`.
#
# Captured promotion SHAs are invariants, not informational outputs. Later jobs
# must re-fetch origin/main and origin/beta, verify they still match
# promotion_base_sha / promotion_target_sha (or, for the final sync, that beta
# has not advanced), and merge/checkout that target SHA only when it is not
# already contained in main. Do not merge, reset, or force-push the live beta
# ref. An already-contained target is a valid no-op: preserve main and
# fast-forward beta without manufacturing an empty merge commit.

jobs:
  detect-promotion-scope:
    name: Detect Promotion Scope
    runs-on: ubuntu-latest
    outputs:
      promotion_base_sha: ${{ steps.scope.outputs.promotion_base_sha }}
      promotion_target_sha: ${{ steps.scope.outputs.promotion_target_sha }}
      promotion_merge_base_sha: ${{ steps.scope.outputs.promotion_merge_base_sha }}
      promotion_type: ${{ steps.scope.outputs.promotion_type }}
      addon_changed: ${{ steps.scope.outputs.addon_changed }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      readme_changed: ${{ steps.scope.outputs.readme_changed }}
      changelog_changed: ${{ steps.scope.outputs.changelog_changed }}
      infra_changed: ${{ steps.scope.outputs.infra_changed }}
      release_required: ${{ steps.scope.outputs.release_required }}
      changelog_required: ${{ steps.scope.outputs.changelog_required }}
      documentation_deploy_required: ${{ steps.scope.outputs.documentation_deploy_required }}
      readme_work_required: ${{ steps.scope.outputs.readme_work_required }}
      has_incoming_changes: ${{ steps.scope.outputs.has_incoming_changes }}
      merge_required: ${{ steps.scope.outputs.merge_required }}

    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v6
        with:
          ref: beta
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Classify incoming promotion range
        id: scope
        run: |
          # Capture SHAs before any later workflow commit can rewrite HEAD.
          # origin/main...HEAD is merge-base(main, beta)..beta: the changes
          # being promoted, not commits that already exist only on main.
          python3 .github/scripts/classify_promotion_scope.py \
            --base origin/main \
            --head HEAD \
            --github-output \
            --step-summary

  # ==========================================
  # Phase 1: Dry Run (validation only, no pushes)
  # ==========================================
  dry-run-pre-merge-validation:
    name: "[DRY RUN] Pre-Merge Validation"
    runs-on: ubuntu-latest
    needs: detect-promotion-scope

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck 1.2.0-1
          pip install -r .github/requirements-lint.txt

      - name: Run linters
        run: python3 .github/scripts/lint_all.py

      - name: Validate packaging
        run: python3 .github/scripts/validate_packaging.py

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate documentation
        run: python3 .github/scripts/validate_docs.py

      - name: Verify promotion TOC versions
        env:
          PROMOTION_BASE_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          PROMOTION_TARGET_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$PROMOTION_BASE_SHA" || git fetch origin main
          git cat-file -t "$PROMOTION_TARGET_SHA" >/dev/null || git fetch origin "$PROMOTION_TARGET_SHA"
          mkdir -p /tmp/promotion-scope
          materialize_scope_helper() {
            local ref="$1"
            git cat-file -e "$ref:.github/scripts/classify_promotion_scope.py" 2>/dev/null || return 1
            git show "$ref:.github/scripts/classify_promotion_scope.py" \
              > /tmp/promotion-scope/classify_promotion_scope.py
            git show "$ref:.github/scripts/validate_packaging.py" \
              > /tmp/promotion-scope/validate_packaging.py
            grep -q -- '--validate-versions' /tmp/promotion-scope/classify_promotion_scope.py
          }
          # Prefer the captured target (this promotion) then captured main so a
          # no-op recovery can use the helper from main when beta predates it.
          materialize_scope_helper "$PROMOTION_TARGET_SHA" \
            || materialize_scope_helper "$PROMOTION_BASE_SHA" \
            || materialize_scope_helper HEAD
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --validate-versions \
            --expected-base "$PROMOTION_BASE_SHA" \
            --expected-target "$PROMOTION_TARGET_SHA"

  dry-run-merge-beta-to-main:
    name: "[DRY RUN] Merge Beta to Main"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, dry-run-pre-merge-validation]
    outputs:
      promotion_base_sha: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
      promotion_target_sha: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
      promotion_type: ${{ needs.detect-promotion-scope.outputs.promotion_type }}
      addon_changed: ${{ needs.detect-promotion-scope.outputs.addon_changed }}
      docs_changed: ${{ needs.detect-promotion-scope.outputs.docs_changed }}
      readme_changed: ${{ needs.detect-promotion-scope.outputs.readme_changed }}
      release_required: ${{ needs.detect-promotion-scope.outputs.release_required }}
      changelog_required: ${{ needs.detect-promotion-scope.outputs.changelog_required }}
      documentation_deploy_required: ${{ needs.detect-promotion-scope.outputs.documentation_deploy_required }}
      readme_work_required: ${{ needs.detect-promotion-scope.outputs.readme_work_required }}
      merge_required: ${{ steps.merge_decision.outputs.merge_required }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      interface: ${{ steps.metadata.outputs.interface }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and verify captured promotion refs
        env:
          EXPECTED_BASE: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main beta
          git cat-file -t "$EXPECTED_TARGET" >/dev/null || git fetch origin "$EXPECTED_TARGET"
          git cat-file -t "$EXPECTED_BASE" >/dev/null || git fetch origin "$EXPECTED_BASE"
          git reset --hard origin/main
          mkdir -p /tmp/promotion-scope
          materialize_scope_helper() {
            local ref="$1"
            git cat-file -e "$ref:.github/scripts/classify_promotion_scope.py" 2>/dev/null || return 1
            git show "$ref:.github/scripts/classify_promotion_scope.py" \
              > /tmp/promotion-scope/classify_promotion_scope.py
            git show "$ref:.github/scripts/validate_packaging.py" \
              > /tmp/promotion-scope/validate_packaging.py
            grep -q -- '--decide-merge' /tmp/promotion-scope/classify_promotion_scope.py
          }
          # Prefer verified origin/main so a no-op recovery can use --decide-merge
          # even when the captured target predates that helper. Fall back to the
          # captured target for the first promotion of this helper onto main.
          materialize_scope_helper HEAD || materialize_scope_helper "$EXPECTED_TARGET"
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --verify-refs \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --current-target origin/beta \
            --mode merge

      - name: Decide whether a merge commit is required
        id: merge_decision
        env:
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --decide-merge \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --github-output

      - name: Verify promotion TOC versions
        env:
          EXPECTED_BASE: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --validate-versions \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET"

      - name: Merge captured promotion target into main
        if: steps.merge_decision.outputs.merge_required == 'true'
        env:
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          # Merge the captured SHA, not the live beta ref. 'ours' keeps main's
          # CHANGELOG.md and README.md, which later jobs regenerate.
          git merge -X ours --no-commit --no-ff "$EXPECTED_TARGET"

          # TOC/changelog/README overlays come from the captured target so a
          # later beta push cannot change what this promotion versions.
          git checkout "$EXPECTED_TARGET" -- CHANGELOG.md README.md SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc

          # Check for conflicts in other files
          if git diff --name-only --diff-filter=U | grep -v -E '(CHANGELOG\.md|README\.md|SpectrumFederation\.toc|SpectrumFederation_CursedSurgeTracker\.toc|SpectrumFederation_RCLootCouncilIntegration\.toc)'; then
            echo "::error ::Merge conflicts detected in files other than CHANGELOG.md, README.md, and .toc"
            echo "Please resolve conflicts manually and try again"
            git merge --abort
            exit 1
          fi

          if [[ "${{ needs.detect-promotion-scope.outputs.addon_changed }}" == "true" ]]; then
            COMMIT_MESSAGE="chore: promote beta to main [skip ci]"
          else
            COMMIT_MESSAGE="chore: promote non-addon changes to main [skip ci]"
          fi
          git commit -m "$COMMIT_MESSAGE"

      - name: Preserve current main (no merge required)
        if: steps.merge_decision.outputs.merge_required != 'true'
        run: |
          echo "Captured promotion target is already contained in origin/main."
          echo "No merge commit required. Preserving the current main tree."
          echo "CHANGELOG.md, README.md, and TOC files are not overlaid from beta."
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is dirty on a no-op merge; refusing to continue"
            git status
            exit 1
          fi

      - name: Set up Python
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate merged TOC version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        run: |
          MERGED_VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
          echo "Merged TOC version: $MERGED_VERSION"

          if [[ ! "$MERGED_VERSION" =~ -beta\. ]]; then
            echo "::error ::Merged TOC version '$MERGED_VERSION' does not contain -beta suffix"
            echo "This indicates the merge did not use the captured promotion target TOC correctly"
            exit 1
          fi

          echo "✓ Merged version contains -beta suffix as expected"

      - name: Remove -beta suffix from version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        id: remove_beta
        run: |
          BETA_VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
          STABLE_VERSION=$(echo "$BETA_VERSION" | sed 's/-beta\.[0-9]*$//')

          echo "Beta version: $BETA_VERSION"
          echo "Stable version: $STABLE_VERSION"
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT

          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git add SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git commit -m "chore: update version to $STABLE_VERSION [skip ci]"

      - name: Query Blizzard API for live Interface version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        id: blizzard
        run: |
          INTERFACE=$(python3 .github/scripts/blizzard_api.py --environment live --output interface)
          echo "interface=$INTERFACE" >> $GITHUB_OUTPUT
          echo "Live Interface version: $INTERFACE"

      - name: Update Interface version in TOC
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        run: |
          INTERFACE="${{ steps.blizzard.outputs.interface }}"
          echo "Updating Interface to: $INTERFACE"

          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git add SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git commit -m "chore: update Interface to $INTERFACE [skip ci]" || echo "No Interface changes"

      - name: Set promotion metadata
        id: metadata
        run: |
          if [[ "${{ needs.detect-promotion-scope.outputs.release_required }}" == "true" ]]; then
            VERSION="${{ steps.remove_beta.outputs.stable_version }}"
            INTERFACE="${{ steps.blizzard.outputs.interface }}"
          else
            VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
            INTERFACE=$(grep -E '^## Interface:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Interface://i' | xargs)
          fi

          echo "stable_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "interface=$INTERFACE" >> "$GITHUB_OUTPUT"

      - name: Push changes to main
        if: false  # Dry run - skip push
        run: git push origin main

  dry-run-update-changelog-main:
    name: "[DRY RUN] Update Changelog for Main"
    runs-on: ubuntu-latest
    needs: dry-run-merge-beta-to-main
    if: |
      !cancelled() &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      needs.dry-run-merge-beta-to-main.outputs.changelog_required == 'true'
    permissions:
      contents: write
      pull-requests: read
      copilot-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch captured promotion target
        env:
          EXPECTED_TARGET: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin beta --tags
          git cat-file -t "$EXPECTED_TARGET" >/dev/null || git fetch origin "$EXPECTED_TARGET"
          git show "$EXPECTED_TARGET:.github/scripts/update_changelog.py" \
            > /tmp/update_changelog.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: main
          CHANGELOG_MODE: promote
          CHANGELOG_VERSION: ${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}
          CHANGELOG_BASE_REF: HEAD
          CHANGELOG_HEAD_REF: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
          CHANGELOG_NOTES_REF: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          python3 /tmp/update_changelog.py

      - name: Commit changelog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "docs: update changelog for ${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }} [skip ci]"
          fi

      - name: Push changelog to main
        if: false  # Dry run - skip push
        run: |
          git pull --rebase origin main
          git push

  dry-run-update-readme-main:
    name: "[DRY RUN] Update README for Main"
    runs-on: ubuntu-latest
    needs: [dry-run-merge-beta-to-main, dry-run-update-changelog-main]
    if: |
      !cancelled() &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      (needs.dry-run-update-changelog-main.result == 'success' || needs.dry-run-update-changelog-main.result == 'skipped') &&
      needs.dry-run-merge-beta-to-main.outputs.readme_work_required == 'true'

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update README badges
        run: |
          VERSION="${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}"
          INTERFACE="${{ needs.dry-run-merge-beta-to-main.outputs.interface }}"
          INTERFACE_DISPLAY=$(python3 .github/scripts/blizzard_api.py --format-interface "$INTERFACE")

          echo "Updating README badges:"
          echo "  Version: $VERSION"
          echo "  Interface: $INTERFACE ($INTERFACE_DISPLAY)"

          # Escape hyphens for shields.io (- becomes --)
          VERSION_ESCAPED="${VERSION//-/--}"

          # Update version badge (match between Version- and - at end)
          sed -i 's|badge/Version-[^)]*-brightgreen|badge/Version-'"${VERSION_ESCAPED}"'-brightgreen|g' README.md

          # Update interface badge (120100 -> 12.1.0)
          sed -i "s|badge/Interface-[^-]*-|badge/Interface-${INTERFACE_DISPLAY}-|g" README.md

          # Update track badge to Retail
          sed -i 's|badge/Track-[^-]*-|badge/Track-Retail-|g' README.md

      - name: Commit badge changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No badge changes to commit"
          else
            git add README.md
            git commit -m "docs: update badges for ${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }} [skip ci]"
          fi

      - name: Upload simulated stable README
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-stable-readme
          path: README.md

      - name: Push README to main
        if: false  # Dry run - skip push
        run: |
          git pull --rebase origin main
          git push

  dry-run-deploy-docs:
    name: "[DRY RUN] Deploy Documentation"
    runs-on: ubuntu-latest
    needs: [dry-run-merge-beta-to-main, dry-run-update-changelog-main, dry-run-update-readme-main]
    if: |
      !cancelled() &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      (needs.dry-run-update-changelog-main.result == 'success' || needs.dry-run-update-changelog-main.result == 'skipped') &&
      (needs.dry-run-update-readme-main.result == 'success' || needs.dry-run-update-readme-main.result == 'skipped') &&
      needs.dry-run-merge-beta-to-main.outputs.documentation_deploy_required == 'true'

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}

      - name: Download simulated stable README
        if: needs.dry-run-update-readme-main.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dry-run-stable-readme
          path: .

      - name: Prepare simulated stable TOC
        if: needs.dry-run-merge-beta-to-main.outputs.release_required == 'true'
        run: |
          VERSION="${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}"
          INTERFACE="${{ needs.dry-run-merge-beta-to-main.outputs.interface }}"
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: |
          echo "Validating documentation from the captured promotion target (dry run)..."
          python3 .github/scripts/validate_docs.py
          echo "Documentation validation successful"

      - name: Upload Pages artifact
        if: false  # Dry run - skip upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: false  # Dry run - skip deployment
        id: deployment
        uses: actions/deploy-pages@v4

  dry-run-publish-stable-release:
    name: "[DRY RUN] Publish Stable Release"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, dry-run-merge-beta-to-main, dry-run-update-changelog-main, dry-run-update-readme-main]
    if: |
      !cancelled() &&
      needs.detect-promotion-scope.outputs.release_required == 'true' &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      needs.dry-run-update-changelog-main.result == 'success' &&
      needs.dry-run-update-readme-main.result == 'success'

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}

      - name: Prepare simulated stable addon
        run: |
          VERSION="${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}"
          INTERFACE="${{ needs.dry-run-merge-beta-to-main.outputs.interface }}"
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Version:.*$/## Version: $VERSION/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish_release.py "${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}" --interface "${{ needs.dry-run-merge-beta-to-main.outputs.interface }}" --dry-run

  dry-run-fast-forward-beta:
    name: "[DRY RUN] Fast-Forward Beta to Main"
    runs-on: ubuntu-latest
    needs: [dry-run-merge-beta-to-main, dry-run-update-changelog-main, dry-run-update-readme-main]
    if: |
      !cancelled() &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      (needs.dry-run-update-changelog-main.result == 'success' || needs.dry-run-update-changelog-main.result == 'skipped') &&
      (needs.dry-run-update-readme-main.result == 'success' || needs.dry-run-update-readme-main.result == 'skipped')

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify captured refs are unchanged
        env:
          EXPECTED_BASE: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.dry-run-merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main beta
          git cat-file -t "$EXPECTED_TARGET" >/dev/null || git fetch origin "$EXPECTED_TARGET"
          mkdir -p /tmp/promotion-scope
          git show "$EXPECTED_TARGET:.github/scripts/classify_promotion_scope.py" \
            > /tmp/promotion-scope/classify_promotion_scope.py
          git show "$EXPECTED_TARGET:.github/scripts/validate_packaging.py" \
            > /tmp/promotion-scope/validate_packaging.py
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --verify-refs \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --current-target origin/beta \
            --mode merge
          echo "Dry-run fast-forward would push origin/main to beta without --force after the real merge, provided origin/beta still equals $EXPECTED_TARGET."

      - name: Push fast-forwarded beta
        if: false  # Dry run - skip push
        run: git push origin origin/main:refs/heads/beta

      - name: Verify branches are synced
        if: false  # Dry run - skip verification
        run: |
          git fetch origin
          DIFF=$(git rev-list --count origin/beta...origin/main)

          if [[ $DIFF -ne 0 ]]; then
            echo "::warning ::Branches are not fully synced (diff: $DIFF commits)"
          else
            echo "✓ Beta and main branches are fully synced"
          fi

  dry-run-summary:
    name: "[DRY RUN] Promotion Summary"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, dry-run-pre-merge-validation, dry-run-merge-beta-to-main, dry-run-update-changelog-main, dry-run-update-readme-main, dry-run-deploy-docs, dry-run-publish-stable-release, dry-run-fast-forward-beta]
    if: always()

    steps:
      - name: Summary
        env:
          ADDON_CHANGED: ${{ needs.detect-promotion-scope.outputs.addon_changed }}
          DOCS_CHANGED: ${{ needs.detect-promotion-scope.outputs.docs_changed }}
          README_CHANGED: ${{ needs.detect-promotion-scope.outputs.readme_changed }}
          RELEASE_REQUIRED: ${{ needs.detect-promotion-scope.outputs.release_required }}
          CHANGELOG_REQUIRED: ${{ needs.detect-promotion-scope.outputs.changelog_required }}
          DOCS_DEPLOY_REQUIRED: ${{ needs.detect-promotion-scope.outputs.documentation_deploy_required }}
          README_WORK_REQUIRED: ${{ needs.detect-promotion-scope.outputs.readme_work_required }}
          MERGE_REQUIRED: ${{ needs.detect-promotion-scope.outputs.merge_required }}
          PROMOTION_TYPE: ${{ needs.detect-promotion-scope.outputs.promotion_type }}
          PROMOTION_BASE_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          PROMOTION_TARGET_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
          STABLE_VERSION: ${{ needs.dry-run-merge-beta-to-main.outputs.stable_version }}
          INTERFACE: ${{ needs.dry-run-merge-beta-to-main.outputs.interface }}
          VALIDATION_RESULT: ${{ needs.dry-run-pre-merge-validation.result }}
          MERGE_RESULT: ${{ needs.dry-run-merge-beta-to-main.result }}
          CHANGELOG_RESULT: ${{ needs.dry-run-update-changelog-main.result }}
          README_RESULT: ${{ needs.dry-run-update-readme-main.result }}
          DOCS_RESULT: ${{ needs.dry-run-deploy-docs.result }}
          RELEASE_RESULT: ${{ needs.dry-run-publish-stable-release.result }}
          FASTFORWARD_RESULT: ${{ needs.dry-run-fast-forward-beta.result }}
        run: |
          set -euo pipefail

          outcome_icon() {
            local required="$1"
            local result="$2"
            if [[ "$required" == "true" ]]; then
              if [[ "$result" == "success" ]]; then echo "✅"; else echo "❌"; fi
            else
              if [[ "$result" == "skipped" ]]; then echo "⏭️"; else echo "❌"; fi
            fi
          }

          always_icon() {
            local result="$1"
            if [[ "$result" == "success" ]]; then echo "✅"; else echo "❌"; fi
          }

          yes_no() {
            if [[ "$1" == "true" ]]; then echo "Yes"; else echo "No"; fi
          }

          VALIDATION_STATUS="$(always_icon "$VALIDATION_RESULT")"
          MERGE_STATUS="$(always_icon "$MERGE_RESULT")"
          CHANGELOG_STATUS="$(outcome_icon "$CHANGELOG_REQUIRED" "$CHANGELOG_RESULT")"
          README_STATUS="$(outcome_icon "$README_WORK_REQUIRED" "$README_RESULT")"
          DOCS_STATUS="$(outcome_icon "$DOCS_DEPLOY_REQUIRED" "$DOCS_RESULT")"
          RELEASE_STATUS="$(outcome_icon "$RELEASE_REQUIRED" "$RELEASE_RESULT")"
          FASTFORWARD_STATUS="$(always_icon "$FASTFORWARD_RESULT")"

          ERRORS=()
          if [[ "$VALIDATION_RESULT" != "success" ]]; then
            ERRORS+=("Pre-merge validation was required but result was '$VALIDATION_RESULT'")
          fi
          if [[ "$MERGE_RESULT" != "success" ]]; then
            ERRORS+=("Merge was required but result was '$MERGE_RESULT'")
          fi
          if [[ "$FASTFORWARD_RESULT" != "success" ]]; then
            ERRORS+=("Fast-forward was required but result was '$FASTFORWARD_RESULT'")
          fi
          if [[ "$CHANGELOG_REQUIRED" == "true" && "$CHANGELOG_RESULT" != "success" ]]; then
            ERRORS+=("Changelog update was required but result was '$CHANGELOG_RESULT'")
          fi
          if [[ "$README_WORK_REQUIRED" == "true" && "$README_RESULT" != "success" ]]; then
            ERRORS+=("README work was required but result was '$README_RESULT'")
          fi
          if [[ "$DOCS_DEPLOY_REQUIRED" == "true" && "$DOCS_RESULT" != "success" ]]; then
            ERRORS+=("Documentation deployment was required but result was '$DOCS_RESULT'")
          fi
          if [[ "$RELEASE_REQUIRED" == "true" && "$RELEASE_RESULT" != "success" ]]; then
            ERRORS+=("Stable release was required but result was '$RELEASE_RESULT'")
          fi
          if [[ "$CHANGELOG_REQUIRED" != "true" && "$CHANGELOG_RESULT" != "skipped" ]]; then
            ERRORS+=("Changelog update was not required but ran with result '$CHANGELOG_RESULT'")
          fi
          if [[ "$README_WORK_REQUIRED" != "true" && "$README_RESULT" != "skipped" ]]; then
            ERRORS+=("README work was not required but ran with result '$README_RESULT'")
          fi
          if [[ "$DOCS_DEPLOY_REQUIRED" != "true" && "$DOCS_RESULT" != "skipped" ]]; then
            ERRORS+=("Documentation deployment was not required but ran with result '$DOCS_RESULT'")
          fi
          if [[ "$RELEASE_REQUIRED" != "true" && "$RELEASE_RESULT" != "skipped" ]]; then
            ERRORS+=("Stable release was not required but ran with result '$RELEASE_RESULT'")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            TITLE="## [DRY RUN] Promotion Failed ❌"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            TITLE="## [DRY RUN] Promotion Cancelled ⚠️"
          else
            TITLE="## [DRY RUN] Promotion Validation Complete ✅"
          fi

          {
            echo "$TITLE"
            echo ""
            echo "### Detected Scope"
            echo ""
            echo "| Signal | Value |"
            echo "| --- | --- |"
            echo "| Promotion type | ${PROMOTION_TYPE:-unknown} |"
            echo "| Base SHA | ${PROMOTION_BASE_SHA:-unknown} |"
            echo "| Target SHA | ${PROMOTION_TARGET_SHA:-unknown} |"
            echo "| Addon changes | $(yes_no "$ADDON_CHANGED") |"
            echo "| Documentation changes | $(yes_no "$DOCS_CHANGED") |"
            echo "| README changed | $(yes_no "$README_CHANGED") |"
            echo "| Changelog required | $(yes_no "$CHANGELOG_REQUIRED") |"
            echo "| README work required | $(yes_no "$README_WORK_REQUIRED") |"
            echo "| Stable addon release | $(yes_no "$RELEASE_REQUIRED") |"
            echo "| Documentation deployment | $(yes_no "$DOCS_DEPLOY_REQUIRED") |"
            echo "| Merge commit required | $(yes_no "$MERGE_REQUIRED") |"
            echo "| Stable version | $STABLE_VERSION |"
            echo "| Interface version | $INTERFACE |"
            echo ""
            echo "### Expected vs Actual"
            echo ""
            echo "| Operation | Required | Result |"
            echo "| --- | --- | --- |"
            echo "| $VALIDATION_STATUS Pre-merge validation | Yes | $VALIDATION_RESULT |"
            echo "| $MERGE_STATUS Merge beta → main | Yes | $MERGE_RESULT |"
            echo "| $CHANGELOG_STATUS Changelog update | $(yes_no "$CHANGELOG_REQUIRED") | $CHANGELOG_RESULT |"
            echo "| $README_STATUS README work | $(yes_no "$README_WORK_REQUIRED") | $README_RESULT |"
            echo "| $DOCS_STATUS Documentation deployment | $(yes_no "$DOCS_DEPLOY_REQUIRED") | $DOCS_RESULT |"
            echo "| $RELEASE_STATUS Stable addon release | $(yes_no "$RELEASE_REQUIRED") | $RELEASE_RESULT |"
            echo "| $FASTFORWARD_STATUS Fast-forward beta to main | Yes | $FASTFORWARD_RESULT |"
            echo ""
            echo "⚠️ **This was a DRY RUN - all operations executed locally but no changes were pushed**"
            echo "- No commits were pushed to branches"
            echo "- No GitHub release was created"
            echo "- No documentation was deployed"
            echo ""
            echo "✅ **If validation passed, the actual promotion will now proceed automatically in this same workflow run**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Outcome mismatches" >> "$GITHUB_STEP_SUMMARY"
            for error in "${ERRORS[@]}"; do
              echo "::error::$error"
              echo "- $error" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi

  # ==========================================
  # Phase 2: Actual Promotion (only if dry run succeeds)
  # ==========================================
  merge-beta-to-main:
    name: "Merge Beta to Main"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, dry-run-pre-merge-validation, dry-run-merge-beta-to-main, dry-run-update-changelog-main, dry-run-update-readme-main, dry-run-deploy-docs, dry-run-publish-stable-release, dry-run-fast-forward-beta, dry-run-summary]
    if: |
      !cancelled() &&
      needs.detect-promotion-scope.result == 'success' &&
      needs.dry-run-pre-merge-validation.result == 'success' &&
      needs.dry-run-merge-beta-to-main.result == 'success' &&
      (
        needs.dry-run-update-changelog-main.result == 'success' ||
        (
          needs.detect-promotion-scope.outputs.changelog_required != 'true' &&
          needs.dry-run-update-changelog-main.result == 'skipped'
        )
      ) &&
      (
        needs.dry-run-update-readme-main.result == 'success' ||
        (
          needs.detect-promotion-scope.outputs.readme_work_required != 'true' &&
          needs.dry-run-update-readme-main.result == 'skipped'
        )
      ) &&
      (
        needs.dry-run-deploy-docs.result == 'success' ||
        (
          needs.detect-promotion-scope.outputs.documentation_deploy_required != 'true' &&
          needs.dry-run-deploy-docs.result == 'skipped'
        )
      ) &&
      (
        needs.dry-run-publish-stable-release.result == 'success' ||
        (
          needs.detect-promotion-scope.outputs.release_required != 'true' &&
          needs.dry-run-publish-stable-release.result == 'skipped'
        )
      ) &&
      needs.dry-run-fast-forward-beta.result == 'success' &&
      needs.dry-run-summary.result == 'success'
    outputs:
      promotion_base_sha: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
      promotion_target_sha: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
      promotion_type: ${{ needs.detect-promotion-scope.outputs.promotion_type }}
      addon_changed: ${{ needs.detect-promotion-scope.outputs.addon_changed }}
      docs_changed: ${{ needs.detect-promotion-scope.outputs.docs_changed }}
      readme_changed: ${{ needs.detect-promotion-scope.outputs.readme_changed }}
      release_required: ${{ needs.detect-promotion-scope.outputs.release_required }}
      changelog_required: ${{ needs.detect-promotion-scope.outputs.changelog_required }}
      documentation_deploy_required: ${{ needs.detect-promotion-scope.outputs.documentation_deploy_required }}
      readme_work_required: ${{ needs.detect-promotion-scope.outputs.readme_work_required }}
      merge_required: ${{ steps.merge_decision.outputs.merge_required }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      interface: ${{ steps.metadata.outputs.interface }}

    steps:
      - name: Log phase transition
        run: |
          echo "::notice::🚀 DRY RUN PASSED - Starting actual promotion to main"
          echo "## 🚀 Actual Promotion Phase Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The dry run validation passed successfully. Now performing the actual promotion..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and verify captured promotion refs
        env:
          EXPECTED_BASE: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main beta
          git cat-file -t "$EXPECTED_TARGET" >/dev/null || git fetch origin "$EXPECTED_TARGET"
          git cat-file -t "$EXPECTED_BASE" >/dev/null || git fetch origin "$EXPECTED_BASE"
          git reset --hard origin/main
          mkdir -p /tmp/promotion-scope
          materialize_scope_helper() {
            local ref="$1"
            git cat-file -e "$ref:.github/scripts/classify_promotion_scope.py" 2>/dev/null || return 1
            git show "$ref:.github/scripts/classify_promotion_scope.py" \
              > /tmp/promotion-scope/classify_promotion_scope.py
            git show "$ref:.github/scripts/validate_packaging.py" \
              > /tmp/promotion-scope/validate_packaging.py
            grep -q -- '--decide-merge' /tmp/promotion-scope/classify_promotion_scope.py
          }
          # Prefer verified origin/main so a no-op recovery can use --decide-merge
          # even when the captured target predates that helper. Fall back to the
          # captured target for the first promotion of this helper onto main.
          materialize_scope_helper HEAD || materialize_scope_helper "$EXPECTED_TARGET"
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --verify-refs \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --current-target origin/beta \
            --mode merge

      - name: Decide whether a merge commit is required
        id: merge_decision
        env:
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --decide-merge \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --github-output

      - name: Verify promotion TOC versions
        env:
          EXPECTED_BASE: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --validate-versions \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET"

      - name: Merge captured promotion target into main
        if: steps.merge_decision.outputs.merge_required == 'true'
        env:
          EXPECTED_TARGET: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
        run: |
          # Merge the captured SHA, not the live beta ref. 'ours' keeps main's
          # CHANGELOG.md and README.md, which later jobs regenerate.
          git merge -X ours --no-commit --no-ff "$EXPECTED_TARGET"

          # TOC/changelog/README overlays come from the captured target so a
          # later beta push cannot change what this promotion versions.
          git checkout "$EXPECTED_TARGET" -- CHANGELOG.md README.md SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc

          # Check for conflicts in other files
          if git diff --name-only --diff-filter=U | grep -v -E '(CHANGELOG\.md|README\.md|SpectrumFederation\.toc|SpectrumFederation_CursedSurgeTracker\.toc|SpectrumFederation_RCLootCouncilIntegration\.toc)'; then
            echo "::error ::Merge conflicts detected in files other than CHANGELOG.md, README.md, and .toc"
            echo "Please resolve conflicts manually and try again"
            git merge --abort
            exit 1
          fi

          if [[ "${{ needs.detect-promotion-scope.outputs.addon_changed }}" == "true" ]]; then
            COMMIT_MESSAGE="chore: promote beta to main [skip ci]"
          else
            COMMIT_MESSAGE="chore: promote non-addon changes to main [skip ci]"
          fi
          git commit -m "$COMMIT_MESSAGE"

      - name: Preserve current main (no merge required)
        if: steps.merge_decision.outputs.merge_required != 'true'
        run: |
          echo "Captured promotion target is already contained in origin/main."
          echo "No merge commit required. Preserving the current main tree."
          echo "CHANGELOG.md, README.md, and TOC files are not overlaid from beta."
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is dirty on a no-op merge; refusing to continue"
            git status
            exit 1
          fi

      - name: Set up Python
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate merged TOC version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        run: |
          MERGED_VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
          echo "Merged TOC version: $MERGED_VERSION"

          if [[ ! "$MERGED_VERSION" =~ -beta\. ]]; then
            echo "::error ::Merged TOC version '$MERGED_VERSION' does not contain -beta suffix"
            echo "This indicates the merge did not use the captured promotion target TOC correctly"
            exit 1
          fi

          echo "✓ Merged version contains -beta suffix as expected"

      - name: Remove -beta suffix from version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        id: remove_beta
        run: |
          BETA_VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
          STABLE_VERSION=$(echo "$BETA_VERSION" | sed 's/-beta\.[0-9]*$//')

          echo "Beta version: $BETA_VERSION"
          echo "Stable version: $STABLE_VERSION"
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT

          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Version:.*$/## Version: $STABLE_VERSION/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git add SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git commit -m "chore: update version to $STABLE_VERSION [skip ci]"

      - name: Query Blizzard API for live Interface version
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        id: blizzard
        run: |
          INTERFACE=$(python3 .github/scripts/blizzard_api.py --environment live --output interface)
          echo "interface=$INTERFACE" >> $GITHUB_OUTPUT
          echo "Live Interface version: $INTERFACE"

      - name: Update Interface version in TOC
        if: needs.detect-promotion-scope.outputs.release_required == 'true'
        run: |
          INTERFACE="${{ steps.blizzard.outputs.interface }}"
          echo "Updating Interface to: $INTERFACE"

          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation/SpectrumFederation.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc
          sed -i "s/^## Interface:.*$/## Interface: $INTERFACE/" SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git add SpectrumFederation/SpectrumFederation.toc SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc
          git commit -m "chore: update Interface to $INTERFACE [skip ci]" || echo "No Interface changes"

      - name: Set promotion metadata
        id: metadata
        run: |
          if [[ "${{ needs.detect-promotion-scope.outputs.release_required }}" == "true" ]]; then
            VERSION="${{ steps.remove_beta.outputs.stable_version }}"
            INTERFACE="${{ steps.blizzard.outputs.interface }}"
          else
            VERSION=$(grep -E '^## Version:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Version://i' | xargs)
            INTERFACE=$(grep -E '^## Interface:' SpectrumFederation/SpectrumFederation.toc | head -n1 | sed 's/^## Interface://i' | xargs)
          fi

          echo "stable_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "interface=$INTERFACE" >> "$GITHUB_OUTPUT"

      - name: Push changes to main
        run: git push origin main

  update-changelog-main:
    name: "Update Changelog for Main"
    runs-on: ubuntu-latest
    needs: merge-beta-to-main
    if: |
      !cancelled() &&
      needs.merge-beta-to-main.result == 'success' &&
      needs.merge-beta-to-main.outputs.changelog_required == 'true'
    permissions:
      contents: write
      pull-requests: read
      copilot-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Fetch captured promotion target
        env:
          EXPECTED_TARGET: ${{ needs.merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          git fetch origin "$EXPECTED_TARGET" || git fetch origin beta --tags

      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: main
          CHANGELOG_MODE: promote
          CHANGELOG_NOTES_REF: ${{ needs.merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          python3 .github/scripts/update_changelog.py

      - name: Commit changelog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes to commit"
          else
            git add CHANGELOG.md
            git commit -m "docs: update changelog for ${{ needs.merge-beta-to-main.outputs.stable_version }} [skip ci]"
          fi

      - name: Push changelog to main
        run: |
          git pull --rebase origin main
          git push

  update-readme-main:
    name: "Update README for Main"
    runs-on: ubuntu-latest
    needs: [merge-beta-to-main, update-changelog-main]
    if: |
      !cancelled() &&
      needs.merge-beta-to-main.result == 'success' &&
      (needs.update-changelog-main.result == 'success' || needs.update-changelog-main.result == 'skipped') &&
      needs.merge-beta-to-main.outputs.readme_work_required == 'true'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update README badges
        run: |
          VERSION="${{ needs.merge-beta-to-main.outputs.stable_version }}"
          INTERFACE="${{ needs.merge-beta-to-main.outputs.interface }}"
          INTERFACE_DISPLAY=$(python3 .github/scripts/blizzard_api.py --format-interface "$INTERFACE")

          echo "Updating README badges:"
          echo "  Version: $VERSION"
          echo "  Interface: $INTERFACE ($INTERFACE_DISPLAY)"

          # Escape hyphens for shields.io (- becomes --)
          VERSION_ESCAPED="${VERSION//-/--}"

          # Update version badge (match between Version- and - at end)
          sed -i 's|badge/Version-[^)]*-brightgreen|badge/Version-'"${VERSION_ESCAPED}"'-brightgreen|g' README.md

          # Update interface badge (120100 -> 12.1.0)
          sed -i "s|badge/Interface-[^-]*-|badge/Interface-${INTERFACE_DISPLAY}-|g" README.md

          # Update track badge to Retail
          sed -i 's|badge/Track-[^-]*-|badge/Track-Retail-|g' README.md

      - name: Commit badge changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No badge changes to commit"
          else
            git add README.md
            git commit -m "docs: update badges for ${{ needs.merge-beta-to-main.outputs.stable_version }} [skip ci]"
          fi

      - name: Push README to main
        run: |
          git pull --rebase origin main
          git push

  deploy-docs:
    name: "Deploy Documentation"
    runs-on: ubuntu-latest
    needs: [merge-beta-to-main, update-changelog-main, update-readme-main]
    if: |
      !cancelled() &&
      needs.merge-beta-to-main.result == 'success' &&
      (needs.update-changelog-main.result == 'success' || needs.update-changelog-main.result == 'skipped') &&
      (needs.update-readme-main.result == 'success' || needs.update-readme-main.result == 'skipped') &&
      needs.merge-beta-to-main.outputs.documentation_deploy_required == 'true'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: |
          echo "Validating documentation from main branch..."
          python3 .github/scripts/validate_docs.py
          echo "Documentation validation successful"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-stable-release:
    name: "Publish Stable Release"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, merge-beta-to-main, update-changelog-main, update-readme-main]
    if: |
      !cancelled() &&
      needs.detect-promotion-scope.outputs.release_required == 'true' &&
      needs.merge-beta-to-main.result == 'success' &&
      needs.update-changelog-main.result == 'success' &&
      needs.update-readme-main.result == 'success'

    steps:
      - name: Log release creation
        run: |
          echo "::notice::📦 Creating stable release v${{ needs.merge-beta-to-main.outputs.stable_version }}"
          echo "## 📦 Creating Stable GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.merge-beta-to-main.outputs.stable_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Interface:** ${{ needs.merge-beta-to-main.outputs.interface }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
        run: |
          python3 .github/scripts/publish_release.py "${{ needs.merge-beta-to-main.outputs.stable_version }}" --interface "${{ needs.merge-beta-to-main.outputs.interface }}"

      - name: Confirm release published
        run: |
          echo "::notice::✅ Release v${{ needs.merge-beta-to-main.outputs.stable_version }} published successfully"
          echo "## ✅ Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Stable release **v${{ needs.merge-beta-to-main.outputs.stable_version }}** has been created and published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.merge-beta-to-main.outputs.stable_version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  fast-forward-beta:
    name: "Fast-Forward Beta to Main"
    runs-on: ubuntu-latest
    needs: [merge-beta-to-main, update-changelog-main, update-readme-main]
    if: |
      !cancelled() &&
      needs.merge-beta-to-main.result == 'success' &&
      (needs.update-changelog-main.result == 'success' || needs.update-changelog-main.result == 'skipped') &&
      (needs.update-readme-main.result == 'success' || needs.update-readme-main.result == 'skipped')

    steps:
      - name: Checkout captured promotion target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.merge-beta-to-main.outputs.promotion_target_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fast-forward beta to main
        env:
          EXPECTED_BASE: ${{ needs.merge-beta-to-main.outputs.promotion_base_sha }}
          EXPECTED_TARGET: ${{ needs.merge-beta-to-main.outputs.promotion_target_sha }}
        run: |
          set -euo pipefail
          git fetch origin main beta
          git cat-file -t "$EXPECTED_TARGET" >/dev/null || git fetch origin "$EXPECTED_TARGET"
          mkdir -p /tmp/promotion-scope
          git show "$EXPECTED_TARGET:.github/scripts/classify_promotion_scope.py" \
            > /tmp/promotion-scope/classify_promotion_scope.py
          git show "$EXPECTED_TARGET:.github/scripts/validate_packaging.py" \
            > /tmp/promotion-scope/validate_packaging.py
          python3 /tmp/promotion-scope/classify_promotion_scope.py \
            --verify-refs \
            --expected-base "$EXPECTED_BASE" \
            --expected-target "$EXPECTED_TARGET" \
            --current-base origin/main \
            --current-target origin/beta \
            --mode fast-forward \
            --fast-forward-to origin/main
          git push origin origin/main:refs/heads/beta

      - name: Verify branches are synced
        run: |
          git fetch origin
          DIFF=$(git rev-list --count origin/beta...origin/main)

          if [[ $DIFF -ne 0 ]]; then
            echo "::warning ::Branches are not fully synced (diff: $DIFF commits)"
          else
            echo "✓ Beta and main branches are fully synced"
          fi

  final-summary:
    name: "Final Promotion Summary"
    runs-on: ubuntu-latest
    needs: [detect-promotion-scope, merge-beta-to-main, update-changelog-main, update-readme-main, deploy-docs, publish-stable-release, fast-forward-beta]
    if: always()

    steps:
      - name: Summary
        env:
          ADDON_CHANGED: ${{ needs.detect-promotion-scope.outputs.addon_changed }}
          DOCS_CHANGED: ${{ needs.detect-promotion-scope.outputs.docs_changed }}
          README_CHANGED: ${{ needs.detect-promotion-scope.outputs.readme_changed }}
          RELEASE_REQUIRED: ${{ needs.detect-promotion-scope.outputs.release_required }}
          CHANGELOG_REQUIRED: ${{ needs.detect-promotion-scope.outputs.changelog_required }}
          DOCS_DEPLOY_REQUIRED: ${{ needs.detect-promotion-scope.outputs.documentation_deploy_required }}
          README_WORK_REQUIRED: ${{ needs.detect-promotion-scope.outputs.readme_work_required }}
          MERGE_REQUIRED: ${{ needs.detect-promotion-scope.outputs.merge_required }}
          PROMOTION_TYPE: ${{ needs.detect-promotion-scope.outputs.promotion_type }}
          PROMOTION_BASE_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_base_sha }}
          PROMOTION_TARGET_SHA: ${{ needs.detect-promotion-scope.outputs.promotion_target_sha }}
          STABLE_VERSION: ${{ needs.merge-beta-to-main.outputs.stable_version }}
          INTERFACE: ${{ needs.merge-beta-to-main.outputs.interface }}
          MERGE_RESULT: ${{ needs.merge-beta-to-main.result }}
          CHANGELOG_RESULT: ${{ needs.update-changelog-main.result }}
          README_RESULT: ${{ needs.update-readme-main.result }}
          DOCS_RESULT: ${{ needs.deploy-docs.result }}
          RELEASE_RESULT: ${{ needs.publish-stable-release.result }}
          FASTFORWARD_RESULT: ${{ needs.fast-forward-beta.result }}
        run: |
          set -euo pipefail

          outcome_icon() {
            local required="$1"
            local result="$2"
            if [[ "$required" == "true" ]]; then
              if [[ "$result" == "success" ]]; then echo "✅"; else echo "❌"; fi
            else
              if [[ "$result" == "skipped" ]]; then echo "⏭️"; else echo "❌"; fi
            fi
          }

          always_icon() {
            local result="$1"
            if [[ "$result" == "success" ]]; then echo "✅"; else echo "❌"; fi
          }

          yes_no() {
            if [[ "$1" == "true" ]]; then echo "Yes"; else echo "No"; fi
          }

          MERGE_STATUS="$(always_icon "$MERGE_RESULT")"
          CHANGELOG_STATUS="$(outcome_icon "$CHANGELOG_REQUIRED" "$CHANGELOG_RESULT")"
          README_STATUS="$(outcome_icon "$README_WORK_REQUIRED" "$README_RESULT")"
          DOCS_STATUS="$(outcome_icon "$DOCS_DEPLOY_REQUIRED" "$DOCS_RESULT")"
          RELEASE_STATUS="$(outcome_icon "$RELEASE_REQUIRED" "$RELEASE_RESULT")"
          FASTFORWARD_STATUS="$(always_icon "$FASTFORWARD_RESULT")"

          ERRORS=()
          if [[ "$MERGE_RESULT" != "success" ]]; then
            ERRORS+=("Merge was required but result was '$MERGE_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$FASTFORWARD_RESULT" != "success" ]]; then
            ERRORS+=("Fast-forward was required but result was '$FASTFORWARD_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$CHANGELOG_REQUIRED" == "true" && "$CHANGELOG_RESULT" != "success" ]]; then
            ERRORS+=("Changelog update was required but result was '$CHANGELOG_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$README_WORK_REQUIRED" == "true" && "$README_RESULT" != "success" ]]; then
            ERRORS+=("README work was required but result was '$README_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$DOCS_DEPLOY_REQUIRED" == "true" && "$DOCS_RESULT" != "success" ]]; then
            ERRORS+=("Documentation deployment was required but result was '$DOCS_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$RELEASE_REQUIRED" == "true" && "$RELEASE_RESULT" != "success" ]]; then
            ERRORS+=("Stable release was required but result was '$RELEASE_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$CHANGELOG_REQUIRED" != "true" && "$CHANGELOG_RESULT" != "skipped" ]]; then
            ERRORS+=("Changelog update was not required but ran with result '$CHANGELOG_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$README_WORK_REQUIRED" != "true" && "$README_RESULT" != "skipped" ]]; then
            ERRORS+=("README work was not required but ran with result '$README_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$DOCS_DEPLOY_REQUIRED" != "true" && "$DOCS_RESULT" != "skipped" ]]; then
            ERRORS+=("Documentation deployment was not required but ran with result '$DOCS_RESULT'")
          fi
          if [[ "$MERGE_RESULT" == "success" && "$RELEASE_REQUIRED" != "true" && "$RELEASE_RESULT" != "skipped" ]]; then
            ERRORS+=("Stable release was not required but ran with result '$RELEASE_RESULT'")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            TITLE="## Promotion Failed ❌"
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            TITLE="## Promotion Cancelled ⚠️"
          else
            TITLE="## Promotion Complete 🎉"
          fi

          {
            echo "$TITLE"
            echo ""
            echo "### Detected Scope"
            echo ""
            echo "| Signal | Detected | Required | Actual |"
            echo "| --- | --- | --- | --- |"
            echo "| Addon changes | $(yes_no "$ADDON_CHANGED") | $(yes_no "$RELEASE_REQUIRED") | $RELEASE_RESULT |"
            echo "| Documentation changes | $(yes_no "$DOCS_CHANGED") | $(yes_no "$DOCS_DEPLOY_REQUIRED") | $DOCS_RESULT |"
            echo "| README changed | $(yes_no "$README_CHANGED") | $(yes_no "$README_WORK_REQUIRED") | $README_RESULT |"
            echo "| Changelog | — | $(yes_no "$CHANGELOG_REQUIRED") | $CHANGELOG_RESULT |"
            echo ""
            echo "**Promotion type**: ${PROMOTION_TYPE:-unknown}"
            echo "**Merge commit required**: $(yes_no "$MERGE_REQUIRED")"
            echo "**Base SHA**: ${PROMOTION_BASE_SHA:-unknown}"
            echo "**Target SHA**: ${PROMOTION_TARGET_SHA:-unknown}"
            echo "**Stable version**: $STABLE_VERSION"
            echo "**Interface version**: $INTERFACE"
            echo ""
            echo "### Job Results"
            echo ""
            echo "- $MERGE_STATUS Merged beta → main (or preserved main when already contained)"
            echo "- $CHANGELOG_STATUS Updated CHANGELOG.md"
            echo "- $README_STATUS Updated README badges"
            echo "- $DOCS_STATUS Deployed documentation"
            echo "- $RELEASE_STATUS Published stable release"
            echo "- $FASTFORWARD_STATUS Fast-forwarded beta to main"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RELEASE_REQUIRED" == "true" && "$RELEASE_RESULT" == "success" ]]; then
            {
              echo "### 📦 Stable Release Created"
              echo ""
              echo "🔗 **[View Release v${STABLE_VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${STABLE_VERSION})**"
              echo ""
              echo "The stable release has been published with:"
              echo "- Release zip file for addon installation"
              echo "- Release metadata (release.json)"
              echo "- Changelog notes"
              echo "- Direct Wago Addons upload with explicit stable classification"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$RELEASE_REQUIRED" != "true" ]]; then
            {
              echo "### ⏭️ Stable Release Skipped"
              echo ""
              echo "No packaged addon files changed in the incoming promotion range."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Release Creation Failed"
              echo ""
              echo "The stable release was NOT created. Check the 'Publish Stable Release' job logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Outcome mismatches" >> "$GITHUB_STEP_SUMMARY"
            for error in "${ERRORS[@]}"; do
              echo "::error::$error"
              echo "- $error" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi
