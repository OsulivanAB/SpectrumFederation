name: Update WoW Game Version

# Manual-only Retail Interface/version update for main and beta without promoting
# unfinished beta features. Installed workflow must live on the default branch.
on:
  workflow_dispatch:
    inputs:
      game_version:
        description: Human-readable Retail version (for example 12.1.5)
        required: true
        type: string
      dry_run:
        description: Preview only; do not mutate branches or publish releases
        required: true
        type: boolean
        default: true
      retry_publication:
        description: Re-publish existing channel-matched versions (CF/Wago recovery); do not bump TOC versions
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Serialize with Promote Beta to Main / Rollback / Post-Merge Beta once those
# workflows also use this group. Preflight additionally fails on active runs of
# those workflows by name so live beta's older `beta-release` group is covered.
# queue: max keeps ordinary pending beta releases instead of replacing them.
concurrency:
  group: release-channels
  queue: max
  cancel-in-progress: false

env:
  HELPERS_DIR: /tmp/sf-game-version-helpers

jobs:
  preflight:
    name: Preflight Plan
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.flags.outputs.dry_run }}
      interface: ${{ steps.plan.outputs.interface }}
      game_version: ${{ steps.plan.outputs.game_version }}
      live_game_version: ${{ steps.plan.outputs.live_game_version }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      beta_sha: ${{ steps.plan.outputs.beta_sha }}
      main_action: ${{ steps.plan.outputs.main_action }}
      beta_action: ${{ steps.plan.outputs.beta_action }}
      main_update_needed: ${{ steps.plan.outputs.main_update_needed }}
      beta_update_needed: ${{ steps.plan.outputs.beta_update_needed }}
      main_current_version: ${{ steps.plan.outputs.main_current_version }}
      beta_current_version: ${{ steps.plan.outputs.beta_current_version }}
      main_target_version: ${{ steps.plan.outputs.main_target_version }}
      beta_target_version: ${{ steps.plan.outputs.beta_target_version }}
      sync_needed: ${{ steps.plan.outputs.sync_needed }}
      sync_main_sha: ${{ steps.plan.outputs.sync_main_sha }}
      sync_reason: ${{ steps.plan.outputs.sync_reason }}
      beta_branch_mutation: ${{ steps.plan.outputs.beta_branch_mutation }}
      any_work: ${{ steps.plan.outputs.any_work }}
      helpers_dir: ${{ env.HELPERS_DIR }}

    steps:
      - name: Require main branch dispatch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Update WoW Game Version must be run from the main branch (selected '${{ github.ref }}')."
          exit 1

      - name: Record dry-run and retry flags
        id: flags
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ inputs.retry_publication }}" == "true" ]]; then
            echo "retry_publication=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry_publication=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout workflow commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch main and beta tips
        run: |
          set -euo pipefail
          git fetch origin main beta

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Materialize pinned helpers from workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/wow_interface_sync.py \
            --materialize-helpers "$HELPERS_DIR" \
            --workflow-sha "$WORKFLOW_SHA"

      - name: Assert no conflicting release workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --assert-no-conflicts \
            --current-run-id "${{ github.run_id }}"

      - name: Plan Interface and version updates
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.game_version }}
          RETRY_PUBLICATION: ${{ steps.flags.outputs.retry_publication }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PLAN_ARGS=(
            --plan
            --requested-version "$REQUESTED_VERSION"
            --main-ref origin/main
            --beta-ref origin/beta
            --dry-run
          )
          if [[ "$RETRY_PUBLICATION" == "true" ]]; then
            PLAN_ARGS+=(--retry-publication)
          fi
          python3 "$HELPERS_DIR/wow_interface_sync.py" "${PLAN_ARGS[@]}"

      - name: Validate packaging helpers on current tree
        run: python3 "$HELPERS_DIR/validate_packaging.py"

      - name: Simulate publish dry-run for main
        if: steps.plan.outputs.main_action == 'update' || steps.plan.outputs.main_action == 'publish'
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.main_sha }}
          TARGET_VERSION: ${{ steps.plan.outputs.main_target_version }}
          TARGET_INTERFACE: ${{ steps.plan.outputs.interface }}
          UPDATE_NEEDED: ${{ steps.plan.outputs.main_update_needed }}
        run: |
          set -euo pipefail
          git checkout --force "$SOURCE_SHA"
          if [[ "$UPDATE_NEEDED" == "true" ]]; then
            python3 "$HELPERS_DIR/wow_interface_sync.py" \
              --apply-interface "$TARGET_INTERFACE" \
              --apply-toc-version "$TARGET_VERSION"
          fi
          python3 "$HELPERS_DIR/publish_release.py" "$TARGET_VERSION" \
            --interface "$TARGET_INTERFACE" \
            --dry-run

      - name: Simulate publish dry-run for beta
        if: steps.plan.outputs.beta_action == 'update' || steps.plan.outputs.beta_action == 'publish'
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.beta_sha }}
          TARGET_VERSION: ${{ steps.plan.outputs.beta_target_version }}
          TARGET_INTERFACE: ${{ steps.plan.outputs.interface }}
          UPDATE_NEEDED: ${{ steps.plan.outputs.beta_update_needed }}
        run: |
          set -euo pipefail
          git checkout --force "$SOURCE_SHA"
          if [[ "$UPDATE_NEEDED" == "true" ]]; then
            python3 "$HELPERS_DIR/wow_interface_sync.py" \
              --apply-interface "$TARGET_INTERFACE" \
              --apply-toc-version "$TARGET_VERSION"
          fi
          python3 "$HELPERS_DIR/publish_release.py" "$TARGET_VERSION" \
            --interface "$TARGET_INTERFACE" \
            --dry-run

  update-main:
    name: Update Main Branch
    runs-on: ubuntu-latest
    needs: preflight
    if: |
      needs.preflight.outputs.dry_run != 'true' &&
      needs.preflight.outputs.main_action == 'update'
    outputs:
      pushed_sha: ${{ steps.push.outputs.pushed_sha }}
      completed: ${{ steps.push.outputs.completed }}

    steps:
      - name: Require PAT_TOKEN for protected branch push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN}" ]]; then
            echo "::error::PAT_TOKEN secret is required to push to protected main/beta. Use a token from a repository Admin (ruleset bypass actor RepositoryRole/Admin). Do not disable branch protection."
            exit 1
          fi

      - name: Checkout main tip
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # Admin PAT bypasses pull_request rulesets used by promote/rollback.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Materialize pinned helpers from workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Materialize helpers via git show so imports exist before any Python
          # bootstrap (wow_interface_sync imports validate_packaging at use time).
          git fetch --no-tags origin "$WORKFLOW_SHA"
          mkdir -p "$HELPERS_DIR"
          for name in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py \
            classify_promotion_scope.py \
            check_duplicate_release.py
          do
            if git cat-file -e "$WORKFLOW_SHA:.github/scripts/$name" 2>/dev/null; then
              git show "$WORKFLOW_SHA:.github/scripts/$name" > "$HELPERS_DIR/$name"
            fi
          done
          for required in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py
          do
            if [[ ! -f "$HELPERS_DIR/$required" ]]; then
              echo "::error::Missing required helper $required from $WORKFLOW_SHA"
              exit 1
            fi
          done

      - name: Verify captured main SHA
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.main_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --verify-ref origin/main \
            --verify-sha "$EXPECTED_SHA"
          git reset --hard "$EXPECTED_SHA"

      - name: Apply TOC, changelog, and README updates
        env:
          TARGET_INTERFACE: ${{ needs.preflight.outputs.interface }}
          TARGET_VERSION: ${{ needs.preflight.outputs.main_target_version }}
          GAME_VERSION: ${{ needs.preflight.outputs.game_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --apply-interface "$TARGET_INTERFACE" \
            --apply-toc-version "$TARGET_VERSION" \
            --update-readme main
          BRANCH_NAME=main \
          CHANGELOG_MODE=compatibility \
          CHANGELOG_VERSION="$TARGET_VERSION" \
          CHANGELOG_INTERFACE="$TARGET_INTERFACE" \
          CHANGELOG_GAME_VERSION="$GAME_VERSION" \
            python3 "$HELPERS_DIR/update_changelog.py"
          python3 "$HELPERS_DIR/validate_packaging.py"

      - name: Commit and push main
        id: push
        env:
          TARGET_INTERFACE: ${{ needs.preflight.outputs.interface }}
          TARGET_VERSION: ${{ needs.preflight.outputs.main_target_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            SpectrumFederation/SpectrumFederation.toc \
            SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc \
            SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc \
            CHANGELOG.md \
            README.md
          if git diff --cached --quiet; then
            echo "::error::Main update produced no staged changes"
            exit 1
          fi
          git commit -m "chore: bump Interface to ${TARGET_INTERFACE} and version to ${TARGET_VERSION} [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::Failed to push main with PAT_TOKEN. Confirm PAT_TOKEN belongs to a repository Admin (ruleset bypass). Do not force-push or weaken protection."
            exit 1
          fi
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "completed=true" >> "$GITHUB_OUTPUT"

  publish-main:
    name: Publish Main Release
    runs-on: ubuntu-latest
    needs: [preflight, update-main]
    if: |
      always() &&
      needs.preflight.outputs.dry_run != 'true' &&
      (needs.preflight.outputs.main_action == 'update' || needs.preflight.outputs.main_action == 'publish') &&
      (
        needs.preflight.outputs.main_action != 'update' ||
        needs.update-main.result == 'success'
      )
    outputs:
      completed: ${{ steps.publish.outputs.completed }}

    steps:
      - name: Resolve publish source SHA
        id: source
        env:
          MAIN_ACTION: ${{ needs.preflight.outputs.main_action }}
          CAPTURED_SHA: ${{ needs.preflight.outputs.main_sha }}
          PUSHED_SHA: ${{ needs.update-main.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          if [[ "$MAIN_ACTION" == "update" ]]; then
            echo "sha=$PUSHED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CAPTURED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout publish source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Materialize pinned helpers from workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$WORKFLOW_SHA"
          mkdir -p "$HELPERS_DIR"
          for name in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py \
            classify_promotion_scope.py \
            check_duplicate_release.py
          do
            if git cat-file -e "$WORKFLOW_SHA:.github/scripts/$name" 2>/dev/null; then
              git show "$WORKFLOW_SHA:.github/scripts/$name" > "$HELPERS_DIR/$name"
            fi
          done
          for required in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py
          do
            if [[ ! -f "$HELPERS_DIR/$required" ]]; then
              echo "::error::Missing required helper $required from $WORKFLOW_SHA"
              exit 1
            fi
          done

      - name: Verify main tip has not drifted before publish-only
        if: needs.preflight.outputs.main_action == 'publish'
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.main_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --verify-ref origin/main \
            --verify-sha "$EXPECTED_SHA"

      - name: Package and publish stable release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          TARGET_VERSION: ${{ needs.preflight.outputs.main_target_version }}
          TARGET_INTERFACE: ${{ needs.preflight.outputs.interface }}
        run: |
          set -euo pipefail
          python3 "$HELPERS_DIR/publish_release.py" "$TARGET_VERSION" --interface "$TARGET_INTERFACE"
          echo "completed=true" >> "$GITHUB_OUTPUT"

  update-beta:
    name: Update Beta Branch
    runs-on: ubuntu-latest
    # Coordinate after main so beta incorporates the completed main update (or a
    # recovered main tip) before any beta push. Skipped update-main is allowed when
    # main did not need a TOC mutation.
    # History-only commits use: chore: sync main game-version update into beta [skip ci]
    needs: [preflight, update-main]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.dry_run != 'true' &&
      needs.preflight.outputs.beta_branch_mutation == 'true' &&
      (
        needs.preflight.outputs.main_action != 'update' ||
        needs.update-main.result == 'success'
      )
    outputs:
      pushed_sha: ${{ steps.push.outputs.pushed_sha }}
      completed: ${{ steps.push.outputs.completed }}
      synced: ${{ steps.push.outputs.synced }}

    steps:
      - name: Require PAT_TOKEN for protected branch push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_TOKEN}" ]]; then
            echo "::error::PAT_TOKEN secret is required to push to protected main/beta. Use a token from a repository Admin (ruleset bypass actor RepositoryRole/Admin). Do not disable branch protection."
            exit 1
          fi

      - name: Checkout beta tip
        uses: actions/checkout@v6
        with:
          ref: beta
          fetch-depth: 0
          # Admin PAT is required for ruleset bypass. Post-Merge Beta is skipped for
          # Interface-bump and history-sync commits; classify_promotion_scope also
          # guards against unintended release_required pushes.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Materialize pinned helpers from workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Beta tip may lack the new helper CLI; materialize from the workflow SHA
          # with all imports together (no single-file Python bootstrap).
          git fetch --no-tags origin "$WORKFLOW_SHA"
          mkdir -p "$HELPERS_DIR"
          for name in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py \
            classify_promotion_scope.py \
            check_duplicate_release.py
          do
            if git cat-file -e "$WORKFLOW_SHA:.github/scripts/$name" 2>/dev/null; then
              git show "$WORKFLOW_SHA:.github/scripts/$name" > "$HELPERS_DIR/$name"
            fi
          done
          for required in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py \
            classify_promotion_scope.py
          do
            if [[ ! -f "$HELPERS_DIR/$required" ]]; then
              echo "::error::Missing required helper $required from $WORKFLOW_SHA"
              exit 1
            fi
          done

      - name: Verify captured beta SHA
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.beta_sha }}
        run: |
          set -euo pipefail
          git fetch origin beta
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --verify-ref origin/beta \
            --verify-sha "$EXPECTED_SHA"
          git reset --hard "$EXPECTED_SHA"

      - name: Resolve main commit to synchronize
        id: sync_source
        env:
          MAIN_ACTION: ${{ needs.preflight.outputs.main_action }}
          SYNC_NEEDED: ${{ needs.preflight.outputs.sync_needed }}
          PLAN_SYNC_SHA: ${{ needs.preflight.outputs.sync_main_sha }}
          PUSHED_MAIN_SHA: ${{ needs.update-main.outputs.pushed_sha }}
          CAPTURED_MAIN_SHA: ${{ needs.preflight.outputs.main_sha }}
        run: |
          set -euo pipefail
          if [[ "$MAIN_ACTION" == "update" ]]; then
            if [[ -z "${PUSHED_MAIN_SHA}" ]]; then
              echo "::error::update-main did not produce pushed_sha for synchronization"
              exit 1
            fi
            echo "sha=$PUSHED_MAIN_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$SYNC_NEEDED" == "true" ]]; then
            if [[ -z "${PLAN_SYNC_SHA}" ]]; then
              echo "::error::sync_needed but preflight did not capture sync_main_sha"
              exit 1
            fi
            echo "sha=$PLAN_SYNC_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi
          # Refuse drifting main tips when recovering a previously completed main update.
          if [[ "$MAIN_ACTION" != "update" && "$SYNC_NEEDED" == "true" ]]; then
            git fetch origin main
            python3 "$HELPERS_DIR/wow_interface_sync.py" \
              --verify-ref origin/main \
              --verify-sha "$CAPTURED_MAIN_SHA"
          fi

      - name: Synchronize main into beta and finalize metadata
        id: integrate
        env:
          MAIN_SHA: ${{ steps.sync_source.outputs.sha }}
          SYNC_NEEDED: ${{ needs.preflight.outputs.sync_needed }}
          BETA_UPDATE_NEEDED: ${{ needs.preflight.outputs.beta_update_needed }}
          TARGET_INTERFACE: ${{ needs.preflight.outputs.interface }}
          TARGET_VERSION: ${{ needs.preflight.outputs.beta_target_version }}
          GAME_VERSION: ${{ needs.preflight.outputs.game_version }}
          BEFORE_SHA: ${{ needs.preflight.outputs.beta_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main beta

          SYNCED=false
          if [[ -n "${MAIN_SHA}" && ( "$SYNC_NEEDED" == "true" || "$BETA_UPDATE_NEEDED" == "true" ) ]]; then
            # Merge + finalize into one local commit before any beta push.
            INTEGRATE_ARGS=(
              --integrate-main-into-beta "$MAIN_SHA"
              --apply-interface "$TARGET_INTERFACE"
              --beta-target-version "$TARGET_VERSION"
              --game-version "$GAME_VERSION"
            )
            if [[ "$BETA_UPDATE_NEEDED" == "true" ]]; then
              INTEGRATE_ARGS+=(--beta-update-needed)
            fi
            python3 "$HELPERS_DIR/wow_interface_sync.py" "${INTEGRATE_ARGS[@]}"
            SYNCED=true
          elif [[ "$BETA_UPDATE_NEEDED" == "true" ]]; then
            python3 "$HELPERS_DIR/wow_interface_sync.py" \
              --apply-interface "$TARGET_INTERFACE" \
              --apply-toc-version "$TARGET_VERSION" \
              --update-readme beta
            BRANCH_NAME=beta \
            CHANGELOG_MODE=compatibility \
            CHANGELOG_VERSION="$TARGET_VERSION" \
            CHANGELOG_INTERFACE="$TARGET_INTERFACE" \
            CHANGELOG_GAME_VERSION="$GAME_VERSION" \
              python3 "$HELPERS_DIR/update_changelog.py"
            if [[ -f .github/workflows/post-merge-beta.yml ]]; then
              python3 "$HELPERS_DIR/wow_interface_sync.py" \
                --ensure-beta-release-concurrency .github/workflows/post-merge-beta.yml
            fi
            git add \
              SpectrumFederation/SpectrumFederation.toc \
              SpectrumFederation_CursedSurgeTracker/SpectrumFederation_CursedSurgeTracker.toc \
              SpectrumFederation_RCLootCouncilIntegration/SpectrumFederation_RCLootCouncilIntegration.toc \
              CHANGELOG.md \
              README.md
            if [[ -f .github/workflows/post-merge-beta.yml ]]; then
              git add .github/workflows/post-merge-beta.yml
            fi
            if git diff --cached --quiet; then
              echo "::error::Beta update produced no staged changes"
              exit 1
            fi
            git commit -m "chore: bump Interface to ${TARGET_INTERFACE} and version to ${TARGET_VERSION} [skip ci]"
          else
            echo "::error::Beta mutation requested without sync source or beta update"
            exit 1
          fi

          python3 "$HELPERS_DIR/validate_packaging.py"

          if [[ -n "${MAIN_SHA}" ]]; then
            if ! git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
              echo "::error::Beta tip does not contain synchronized main commit $MAIN_SHA"
              exit 1
            fi
          fi

          # History-only synchronization must not classify as a beta addon release.
          if [[ "$BETA_UPDATE_NEEDED" != "true" ]]; then
            SCOPE_OUT="$(mktemp)"
            GITHUB_OUTPUT="$SCOPE_OUT" PYTHONPATH="$HELPERS_DIR" \
              python3 "$HELPERS_DIR/classify_promotion_scope.py" \
              --base "$BEFORE_SHA" \
              --head HEAD \
              --github-output
            if grep -q '^release_required=true$' "$SCOPE_OUT"; then
              echo "::error::History-only main→beta sync produced release_required changes; refusing to push an unintended Post-Merge Beta release."
              exit 1
            fi
            echo "[sync] History-only sync classified as non-release"
          fi

          echo "synced=$SYNCED" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push beta
        id: push
        env:
          SYNCED: ${{ steps.integrate.outputs.synced }}
          COMMIT_SHA: ${{ steps.integrate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]]; then
            echo "::error::Beta HEAD drifted after local integration commit"
            exit 1
          fi
          if ! git push origin HEAD:beta; then
            echo "::error::Failed to push beta with PAT_TOKEN. Confirm PAT_TOKEN belongs to a repository Admin (ruleset bypass). Do not force-push or weaken protection."
            exit 1
          fi
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "completed=true" >> "$GITHUB_OUTPUT"
          echo "synced=${SYNCED:-false}" >> "$GITHUB_OUTPUT"

  publish-beta:
    name: Publish Beta Release
    runs-on: ubuntu-latest
    needs: [preflight, update-beta]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.dry_run != 'true' &&
      (needs.preflight.outputs.beta_action == 'update' || needs.preflight.outputs.beta_action == 'publish') &&
      (
        needs.preflight.outputs.beta_branch_mutation != 'true' ||
        needs.update-beta.result == 'success'
      ) &&
      (
        needs.preflight.outputs.beta_action != 'update' ||
        needs.update-beta.result == 'success'
      )
    outputs:
      completed: ${{ steps.publish.outputs.completed }}

    steps:
      - name: Resolve publish source SHA
        id: source
        env:
          BETA_ACTION: ${{ needs.preflight.outputs.beta_action }}
          CAPTURED_SHA: ${{ needs.preflight.outputs.beta_sha }}
          PUSHED_SHA: ${{ needs.update-beta.outputs.pushed_sha }}
        run: |
          set -euo pipefail
          if [[ "$BETA_ACTION" == "update" ]]; then
            echo "sha=$PUSHED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CAPTURED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout publish source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Materialize pinned helpers from workflow commit
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$WORKFLOW_SHA"
          mkdir -p "$HELPERS_DIR"
          for name in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py \
            classify_promotion_scope.py \
            check_duplicate_release.py
          do
            if git cat-file -e "$WORKFLOW_SHA:.github/scripts/$name" 2>/dev/null; then
              git show "$WORKFLOW_SHA:.github/scripts/$name" > "$HELPERS_DIR/$name"
            fi
          done
          for required in \
            wow_interface_sync.py \
            update_changelog.py \
            publish_release.py \
            validate_packaging.py \
            blizzard_api.py
          do
            if [[ ! -f "$HELPERS_DIR/$required" ]]; then
              echo "::error::Missing required helper $required from $WORKFLOW_SHA"
              exit 1
            fi
          done

      - name: Verify beta tip has not drifted before publish-only
        if: needs.preflight.outputs.beta_action == 'publish'
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.beta_sha }}
        run: |
          set -euo pipefail
          git fetch origin beta
          python3 "$HELPERS_DIR/wow_interface_sync.py" \
            --verify-ref origin/beta \
            --verify-sha "$EXPECTED_SHA"

      - name: Overlay live generated notes when publishing a prior tip
        if: needs.preflight.outputs.beta_action == 'publish'
        run: |
          set -euo pipefail
          git fetch origin beta
          git checkout origin/beta -- CHANGELOG.md README.md || true

      - name: Refuse stable-version beta publish
        env:
          TARGET_VERSION: ${{ needs.preflight.outputs.beta_target_version }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_VERSION" =~ -beta\. ]]; then
            echo "::error::Refusing to publish non-beta version '$TARGET_VERSION' from the beta channel."
            exit 1
          fi

      - name: Package and publish beta release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          WAGO_API_KEY: ${{ secrets.WAGO_API_KEY }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          TARGET_VERSION: ${{ needs.preflight.outputs.beta_target_version }}
          TARGET_INTERFACE: ${{ needs.preflight.outputs.interface }}
        run: |
          set -euo pipefail
          python3 "$HELPERS_DIR/publish_release.py" "$TARGET_VERSION" --interface "$TARGET_INTERFACE"
          echo "completed=true" >> "$GITHUB_OUTPUT"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [preflight, update-main, publish-main, update-beta, publish-beta]
    if: always()

    steps:
      - name: Write outcome summary
        env:
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          INTERFACE: ${{ needs.preflight.outputs.interface }}
          GAME_VERSION: ${{ needs.preflight.outputs.game_version }}
          MAIN_ACTION: ${{ needs.preflight.outputs.main_action }}
          BETA_ACTION: ${{ needs.preflight.outputs.beta_action }}
          MAIN_VERSION: ${{ needs.preflight.outputs.main_target_version }}
          BETA_VERSION: ${{ needs.preflight.outputs.beta_target_version }}
          SYNC_NEEDED: ${{ needs.preflight.outputs.sync_needed }}
          SYNC_REASON: ${{ needs.preflight.outputs.sync_reason }}
          BETA_MUTATION: ${{ needs.preflight.outputs.beta_branch_mutation }}
          ANY_WORK: ${{ needs.preflight.outputs.any_work }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          UPDATE_MAIN_RESULT: ${{ needs.update-main.result }}
          PUBLISH_MAIN_RESULT: ${{ needs.publish-main.result }}
          UPDATE_BETA_RESULT: ${{ needs.update-beta.result }}
          PUBLISH_BETA_RESULT: ${{ needs.publish-beta.result }}
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }

          ERRORS=()
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            ERRORS+=("Preflight failed with result '$PREFLIGHT_RESULT'")
          fi
          if [[ "$DRY_RUN" != "true" && "$MAIN_ACTION" == "update" && "$UPDATE_MAIN_RESULT" != "success" ]]; then
            ERRORS+=("Main branch update failed ($UPDATE_MAIN_RESULT)")
          fi
          if [[ "$DRY_RUN" != "true" && ( "$MAIN_ACTION" == "update" || "$MAIN_ACTION" == "publish" ) && "$PUBLISH_MAIN_RESULT" != "success" ]]; then
            ERRORS+=("Main publish failed ($PUBLISH_MAIN_RESULT). If GitHub succeeded but CurseForge/Wago failed, rerun with retry_publication=true (no TOC bump). If the GitHub release is missing, a normal rerun recovers publish without a bump when Interface is already current.")
          fi
          if [[ "$DRY_RUN" != "true" && "$BETA_MUTATION" == "true" && "$UPDATE_BETA_RESULT" != "success" ]]; then
            ERRORS+=("Beta branch update/sync failed ($UPDATE_BETA_RESULT). If main already updated, a normal rerun can complete history sync without another version bump when Interfaces are current.")
          fi
          if [[ "$DRY_RUN" != "true" && ( "$BETA_ACTION" == "update" || "$BETA_ACTION" == "publish" ) && "$PUBLISH_BETA_RESULT" != "success" ]]; then
            ERRORS+=("Beta publish failed ($PUBLISH_BETA_RESULT). If GitHub succeeded but CurseForge/Wago failed, rerun with retry_publication=true (no TOC bump). If the GitHub release is missing, a normal rerun recovers publish without a bump when Interface is already current.")
          fi

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            TITLE="## Update WoW Game Version Failed ❌"
          elif [[ "$DRY_RUN" == "true" ]]; then
            TITLE="## Update WoW Game Version Dry Run Complete ✅"
          elif [[ "$ANY_WORK" != "true" ]]; then
            TITLE="## Update WoW Game Version No-Op ✅"
          else
            TITLE="## Update WoW Game Version Complete ✅"
          fi

          {
            echo "$TITLE"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Dry run | $DRY_RUN |"
            echo "| Game version | $GAME_VERSION |"
            echo "| Interface | $INTERFACE |"
            echo "| Main version | $MAIN_VERSION |"
            echo "| Beta version | $BETA_VERSION |"
            echo "| Main action | $MAIN_ACTION |"
            echo "| Beta action | $BETA_ACTION |"
            echo "| Main→beta sync needed | $SYNC_NEEDED |"
            echo "| Sync reason | $SYNC_REASON |"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| $(icon "$PREFLIGHT_RESULT") Preflight | $PREFLIGHT_RESULT |"
            echo "| $(icon "$UPDATE_MAIN_RESULT") Update main | $UPDATE_MAIN_RESULT |"
            echo "| $(icon "$PUBLISH_MAIN_RESULT") Publish main | $PUBLISH_MAIN_RESULT |"
            echo "| $(icon "$UPDATE_BETA_RESULT") Update/sync beta | $UPDATE_BETA_RESULT |"
            echo "| $(icon "$PUBLISH_BETA_RESULT") Publish beta | $PUBLISH_BETA_RESULT |"
            echo ""
            echo "Helpers always run from the dispatched workflow commit, even when the working tree is an older beta tip."
            echo "Protected pushes require PAT_TOKEN from a repository Admin (ruleset bypass)."
            echo "Beta incorporates the completed main game-version commit before a single validated push."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#ERRORS[@]} -gt 0 ]]; then
            echo "### Failures / recovery" >> "$GITHUB_STEP_SUMMARY"
            for error in "${ERRORS[@]}"; do
              echo "::error::$error"
              echo "- $error" >> "$GITHUB_STEP_SUMMARY"
            done
            exit 1
          fi
