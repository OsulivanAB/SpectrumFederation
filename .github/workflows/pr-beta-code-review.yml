# PR Beta Code Review Workflow
#
# Purpose: Provide code review guidance for adding debugging statements to Lua code changes
#          in pull requests to the beta branch.
#
# Trigger: Pull requests to beta branch that modify Lua files in SpectrumFederation/**
#
# Approval: Requires manual approval via the 'beta-code-review' environment
#           Configure in Settings → Environments → beta-code-review
#
# Process:
#   1. Detects changed Lua files in the PR
#   2. Generates a diff of the code changes
#   3. Creates a detailed review prompt for adding SF.Debug logging
#   4. Posts a PR comment with review instructions and context
#   5. Skips execution if no Lua files were changed
#
# Review Focus:
#   - Add debug logging only where genuinely useful (entry points, errors, state changes)
#   - Use appropriate log levels (VERBOSE, INFO, WARN, ERROR)
#   - Follow existing SF.Debug patterns from modules/debug.lua
#   - Avoid trivial logging (getters, setters, simple property access)
#
# Note: This workflow does NOT automatically modify code. It provides guidance for
#       developers to manually add debugging where appropriate during code review.

name: PR Beta Code Review

on:
  pull_request:
    branches:
      - beta
    paths:
      - 'SpectrumFederation/**'
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: beta-code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review-approval:
    name: Code Review Session (Approval Required)
    runs-on: ubuntu-latest
    environment:
      name: beta-code-review
      url: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      - name: Analyze changed files
        id: analyze
        run: |
          # Get list of changed Lua files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep '\.lua$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "no_lua_changes=true" >> $GITHUB_OUTPUT
            echo "No Lua files changed in this PR"
          else
            echo "no_lua_changes=false" >> $GITHUB_OUTPUT
            echo "Changed Lua files:"
            echo "$CHANGED_FILES"

            # Store changed files for the review
            echo "$CHANGED_FILES" > /tmp/changed_files.txt
          fi

      - name: Get PR diff
        if: steps.analyze.outputs.no_lua_changes != 'true'
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.lua' > /tmp/pr_diff.txt

          echo "## PR Diff Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 100 /tmp/pr_diff.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create code review prompt
        if: steps.analyze.outputs.no_lua_changes != 'true'
        run: |
          cat > /tmp/review_prompt.txt << 'EOF'
          # Code Review Task: Add Debugging Where Appropriate

          ## Context
          You are reviewing changes to the SpectrumFederation World of Warcraft addon.
          The addon has an existing debugging system located in `SpectrumFederation/modules/debug.lua`.

          ## Debugging System Reference
          The addon uses `SF.Debug` with these methods:
          - `SF.Debug:Verbose(category, message, ...)` - Verbose level logging
          - `SF.Debug:Info(category, message, ...)` - Info level logging
          - `SF.Debug:Warn(category, message, ...)` - Warning level logging
          - `SF.Debug:Error(category, message, ...)` - Error level logging

          Always wrap debug calls with: `if SF.Debug then SF.Debug:Info("CATEGORY", "message") end`

          ## Your Task
          Review the code changes in this PR and add debugging statements where appropriate.

          **Only add debugging where it would be genuinely useful:**
          - Entry/exit points of significant functions
          - Error conditions or exceptional cases
          - State transitions or important operations
          - Data validation failures
          - Network communication (sync operations)

          **Do NOT add debugging for:**
          - Trivial getters/setters
          - Simple property access
          - UI rendering code unless it involves data binding
          - Every single line of code

          **Guidelines:**
          1. Use appropriate log levels (VERBOSE for detailed flow, INFO for operations, WARN for issues, ERROR for failures)
          2. Use meaningful categories that match the module (e.g., "PROFILES", "SYNC", "MEMBERS")
          3. Include relevant context in log messages (IDs, names, counts)
          4. Use format strings for variable substitution
          5. Keep messages concise but informative

          ## Changed Files
          EOF

          cat /tmp/changed_files.txt >> /tmp/review_prompt.txt

          echo "" >> /tmp/review_prompt.txt
          echo "## Code Changes" >> /tmp/review_prompt.txt
          echo '```diff' >> /tmp/review_prompt.txt
          cat /tmp/pr_diff.txt >> /tmp/review_prompt.txt
          echo '```' >> /tmp/review_prompt.txt

          echo "" >> /tmp/review_prompt.txt
          echo "Review the changes above and add debug logging ONLY where it adds value. Do not make any other modifications." >> /tmp/review_prompt.txt

      - name: Post review summary
        if: steps.analyze.outputs.no_lua_changes != 'true'
        run: |
          echo "## Code Review Session Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A GitHub Copilot coding agent has been dispatched to review the changes in this PR." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Objective**: Add debugging statements where appropriate using the existing SF.Debug system" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changed Lua Files**:" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r file; do
            echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
          done < /tmp/changed_files.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The agent will only add debugging where it provides genuine value." >> $GITHUB_STEP_SUMMARY

      - name: Skip review for non-Lua changes
        if: steps.analyze.outputs.no_lua_changes == 'true'
        run: |
          echo "## No Code Review Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This PR does not contain any Lua code changes, so no debug logging review is necessary." >> $GITHUB_STEP_SUMMARY

      - name: Add PR comment with instructions
        if: steps.analyze.outputs.no_lua_changes != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const changedFiles = fs.readFileSync('/tmp/changed_files.txt', 'utf8').trim().split('\n');

            const comment = `## 🤖 Code Review Session Approved

            A GitHub Copilot coding agent session has been triggered to review code changes and add debugging where appropriate.

            ### Changed Files Under Review
            ${changedFiles.map(f => `- \`${f}\``).join('\n')}

            ### What the Agent Will Do
            - Review code changes for appropriate debugging opportunities
            - Add \`SF.Debug\` logging statements using the existing debug system
            - Focus on entry points, error conditions, state transitions, and important operations
            - Avoid adding trivial or unnecessary debug statements

            ### Debug System Reference
            The agent will use the existing debug system:
            - \`SF.Debug:Info("CATEGORY", "message")\` - Info level
            - \`SF.Debug:Warn("CATEGORY", "message")\` - Warnings
            - \`SF.Debug:Error("CATEGORY", "message")\` - Errors
            - \`SF.Debug:Verbose("CATEGORY", "message")\` - Detailed logging

            The review will focus only on adding debugging - no other changes will be made.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
